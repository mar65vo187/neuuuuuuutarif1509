# Netlify (kostenloser Hobby-Plan) – Deployment aus dem GitHub-Repository.
#
# Netlify erkennt Next.js automatisch (OpenNext-Adapter, App Router wird
# vollständig unterstützt). Der Build läuft in zwei Schritten:
#   1) node scripts/provision-database.mjs
#      – wendet die Migrations an und lädt beim allerersten Build den
#        Seed-Snapshot (seed-backup/) in die Datenbank. Der Schritt ist
#        idempotent und überschreibt vorhandene Daten NIEMALS (Marker-Tabelle
#        tarifwerk_seeded).
#   2) next build
#
# Benötigte Umgebungsvariablen (Dashboard → Site configuration → Environment,
# "Define environment variables"):
#   DATABASE_URL        – die gepoolte PostgreSQL-URL von Neon (Pooler-URL)
#   SESSION_SECRET      – mindestens 32 zufällige Zeichen, dauerhaft gleich halten
#   PORTAL_ADMIN_EMAIL  – Admin-Adresse des Portals
#   PORTAL_ADMIN_PASSWORD – Admin-Passwort des Portals
#   CRON_SECRET         – für den internen Operations-Sweep (Scheduled Function)
#   optional: GROQ_API_KEY / XKIRO_API_KEY / GEMINI_API_KEY / OPENROUTER_API_KEY
[build]
  command = "node scripts/provision-database.mjs && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Täglicher, geschützter Daten-Operations-Sweep als Netlify Scheduled Function
# (ersetzt die frühere Cron-Konfiguration; Aufruf nur mit CRON_SECRET).
[[functions]]
  name = "operations-sweep"
  schedule = "0 4 * * *"
