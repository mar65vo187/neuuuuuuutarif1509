server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://tarifwerk-prod.railway.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Required so Nginx can safely inject the temporary public navigation shim.
        proxy_set_header Accept-Encoding "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        sub_filter_once off;
        sub_filter_types text/html;
        # TarifWerk login visibility safety net: the historic login bundle rendered
        # its root motion wrapper at opacity:0 until hydration completed. If a
        # client chunk fails, the page otherwise stays completely blank.
        sub_filter 'style="opacity:0;transform:translateY(24px)"' 'style="opacity:1;transform:none"';
        sub_filter '</body>' '<script>(()=>{if(window.location.pathname==="/portal/login"){document.querySelectorAll("[style*=\\\"opacity:0\\\"]").forEach((el)=>{el.style.opacity="1";el.style.transform="none"})}if(window.__twPublicNavFix)return;window.__twPublicNavFix=true;document.addEventListener("click",function(e){const t=e.target instanceof Element?e.target:null;if(!t)return;const a=t.closest("a");if(a){const href=a.getAttribute("href")||"";const label=(a.textContent||"").replace(/\\s+/g," ").trim();if(label.includes("Persönlich beraten lassen")&&href.startsWith("/anfrage")){e.preventDefault();e.stopImmediatePropagation();window.location.assign(a.href);return}}const control=t.closest("button,a");if(!control)return;const label=(control.textContent||"").replace(/\\s+/g," ").trim();if(label!=="Privat"&&label!=="Business")return;const mode=label==="Business"?"b2b":"b2c";document.cookie="tarifwerk-audience="+mode+"; Path=/; Max-Age=2592000; SameSite=Lax";const url=new URL(window.location.href);url.searchParams.set("audience",mode);e.preventDefault();e.stopImmediatePropagation();window.location.assign(url.pathname+"?"+url.searchParams.toString()+url.hash)},true);})();</script></body>';
    }
}
