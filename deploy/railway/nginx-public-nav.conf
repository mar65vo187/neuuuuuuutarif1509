server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://tarifwerk-prod.railway.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Required so Nginx can safely inject the temporary public navigation shim.
        proxy_set_header Accept-Encoding "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '</body>' '<script>(()=>{if(window.__twPublicNavFix)return;window.__twPublicNavFix=true;document.addEventListener("click",function(e){const t=e.target instanceof Element?e.target:null;const a=t&&t.closest("a");if(!a)return;const href=a.getAttribute("href")||"";const label=(a.textContent||"").replace(/\\s+/g," ").trim();if(label.includes("Persönlich beraten lassen")&&href.startsWith("/anfrage")){e.preventDefault();e.stopImmediatePropagation();window.location.assign(a.href);}},true);})();</script></body>';
    }
}
