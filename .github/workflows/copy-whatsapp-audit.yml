name: Copy and portal audit

on:
  push:
    branches:
      - fix/formal-language-whatsapp-balance-20260919
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan public copy and WhatsApp usage
        shell: bash
        run: |
          {
            echo "=== remaining informal public address ==="
            grep -RniEi --include='*.tsx' --include='*.ts' --include='*.jsx' --include='*.js' '\b(du|dein|deine|deinen|deinem|deiner|dich|dir|euch|euer|eure)\b'               'src/app/(site)' src/components/home src/components/forms src/components/advisors src/components/referrals src/components/site               src/lib/content.ts src/lib/audience-copy.ts src/lib/referral-rewards.ts src/app/error.tsx src/app/not-found.tsx               src/app/api/leads src/app/api/referrals || true
            echo
            echo "=== remaining public WhatsApp placements ==="
            grep -RniEi --include='*.tsx' --include='*.ts' --include='*.jsx' --include='*.js' 'whats.?app|wa\.me'               'src/app/(site)' src/components/home src/components/forms src/components/advisors src/components/referrals src/components/site               src/app/error.tsx src/app/not-found.tsx || true
            echo
            echo "=== migration files ==="
            find migrations -maxdepth 1 -type f -name '*.sql' -print | sort
            echo
            echo "=== schema config ==="
            cat drizzle.config.ts
          } > audit.txt
          cat audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: copy-portal-audit
          path: audit.txt

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tarifwerk
          POSTGRES_PASSWORD: tarifwerk
          POSTGRES_DB: tarifwerk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarifwerk -d tarifwerk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tarifwerk:tarifwerk@127.0.0.1:5432/tarifwerk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply all migrations
        run: npm run db:migrate
      - name: Verify enterprise tables exist
        run: node scripts/verify-migrations.mjs
      - name: Verify production build path reruns migrations safely
        run: npm run build
