name: Dev Dependency Cleanup

on:
  push:
    branches:
      - audit/dev-dependency-cleanup-20260919
    paths:
      - .github/workflows/dev-dependency-cleanup.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Pin patched build dependencies
        run: |
          npm pkg set overrides.esbuild=0.28.2
          npm install --save-exact postcss@8.5.28

      - name: Full dependency vulnerability gate
        run: npm audit --audit-level=moderate

      - name: Verify Drizzle CLI
        run: npx drizzle-kit --version

      - name: Full project verification
        run: npm run check

      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes."
            exit 0
          fi
          git commit -m "security: harden build dependencies"
          git push origin HEAD:${{ github.ref_name }}
