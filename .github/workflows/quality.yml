name: Quality & Performance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Public performance guard
        run: npm run perf:guard

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build


  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tarifwerk_test
          POSTGRES_USER: tarifwerk
          POSTGRES_PASSWORD: tarifwerk-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarifwerk -d tarifwerk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://tarifwerk:tarifwerk-test-password@localhost:5432/tarifwerk_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify migrations
        run: node scripts/verify-migrations.mjs
