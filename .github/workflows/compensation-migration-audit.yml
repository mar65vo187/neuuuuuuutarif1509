name: Compensation Migration Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tarifwerk
          POSTGRES_PASSWORD: tarifwerk
          POSTGRES_DB: tarifwerk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarifwerk -d tarifwerk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tarifwerk:tarifwerk@127.0.0.1:5432/tarifwerk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: node scripts/verify-migrations.mjs
      - run: node scripts/verify-compensation-schema.mjs
