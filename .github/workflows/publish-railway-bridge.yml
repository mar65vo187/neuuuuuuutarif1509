name: Docker Runtime Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --pull --tag tarifwerk-runtime:ci .

      - name: Start container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name tarifwerk-runtime             --env NODE_ENV=production             --env HOSTNAME=0.0.0.0             --env PORT=3000             --publish 127.0.0.1:3000:3000             tarifwerk-runtime:ci
          trap 'docker stop tarifwerk-runtime >/dev/null 2>&1 || true; docker rm -f tarifwerk-runtime >/dev/null 2>&1 || true' EXIT

      - name: Container HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/tmp/tarifwerk-home.html; then
              test -s /tmp/tarifwerk-home.html
              exit 0
            fi
            if [ "$(docker inspect --format='{{.State.Running}}' tarifwerk-runtime 2>/dev/null || true)" != "true" ]; then
              break
            fi
            sleep 2
          done
          docker logs tarifwerk-runtime || true
          exit 1
