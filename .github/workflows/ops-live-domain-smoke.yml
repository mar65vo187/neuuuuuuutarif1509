name: Ops Railway Domain Bypass Test

on:
  push:
    branches:
      - ops/live-domain-smoke-2026-10-01

permissions:
  contents: read

jobs:
  bypass-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Test Railway frontdoor and custom host
        run: |
          set +e
          TARGET="tarifwerk-web-production-4b7e.up.railway.app"
          echo "=== target DNS ==="
          dig +short A "$TARGET"
          echo "=== target /api/ready ==="
          curl -sv --max-time 20 "https://$TARGET/api/ready" -o /tmp/target-body 2>&1
          cat /tmp/target-body 2>/dev/null || true
          IP="$(dig +short A "$TARGET" | head -n1)"
          echo
          echo "=== custom host via Railway IP: $IP ==="
          curl -sv --max-time 20 --resolve "www.tarifwerk.eu:443:$IP" "https://www.tarifwerk.eu/api/ready" -o /tmp/custom-body 2>&1
          STATUS=$?
          cat /tmp/custom-body 2>/dev/null || true
          echo
          echo "custom_curl_exit=$STATUS"
          echo "=== custom host certificate ==="
          echo | openssl s_client -connect "$IP:443" -servername www.tarifwerk.eu 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName || true
