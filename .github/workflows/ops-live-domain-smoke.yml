name: Ops Provider Smoke

on:
  push:
    branches:
      - ops/live-domain-smoke-2026-10-01

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        base:
          - https://tarifwerk-prod-production.up.railway.app
          - https://neuuuuuuutarif1509--tarifwerk-41e50.europe-west4.hosted.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Route smoke
        env:
          LIVE_BASE_URL: ${{ matrix.base }}
          EXPECTED_REVISION: ""
        run: node scripts/live-production-smoke.mjs

      - name: Public AI smoke
        env:
          BASE: ${{ matrix.base }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE;
          const response = await fetch(base + "/api/public-ai", {
            method: "POST",
            redirect: "follow",
            signal: AbortSignal.timeout(60000),
            headers: {
              "Content-Type": "application/json",
              "Origin": base,
              "Sec-Fetch-Site": "same-origin",
              "User-Agent": "TarifWerk-Provider-AI-Smoke/1.0"
            },
            body: JSON.stringify({
              messages: [{ role: "user", content: "Welche Themen kann TarifWerk beraten? Antworte bitte kurz." }],
              audience: "b2c",
              pagePath: "/"
            })
          });
          const text = await response.text();
          let json;
          try { json = JSON.parse(text); } catch { throw new Error("Kein JSON: " + text.slice(0, 300)); }
          if (!response.ok || json?.ok !== true || typeof json?.text !== "string" || json.text.trim().length < 10) {
            throw new Error("AI smoke failed: HTTP " + response.status + " " + text.slice(0, 500));
          }
          console.log(JSON.stringify({base, ok:true, status:response.status, chars:json.text.length, provider:json.provider ?? null, model:json.model ?? null, redactions:json.redactions ?? 0}));
          NODE
