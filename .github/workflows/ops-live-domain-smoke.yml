name: Ops Current Railway Web E2E

on:
  push:
    branches:
      - ops/live-domain-smoke-2026-10-01

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Full route smoke on current tarifwerk-web
        env:
          LIVE_BASE_URL: https://tarifwerk-web-production-4b7e.up.railway.app
          EXPECTED_REVISION: ""
        run: node scripts/live-production-smoke.mjs
      - name: Public AI on current tarifwerk-web
        run: |
          node --input-type=module <<'NODE'
          const base = "https://tarifwerk-web-production-4b7e.up.railway.app";
          const r = await fetch(base + "/api/public-ai", {
            method:"POST",
            signal:AbortSignal.timeout(60000),
            headers:{"content-type":"application/json","origin":base,"sec-fetch-site":"same-origin"},
            body:JSON.stringify({messages:[{role:"user",content:"Welche Themen kann TarifWerk beraten? Antworte kurz."}],audience:"b2c",pagePath:"/"})
          });
          const text = await r.text();
          if(!r.ok) throw new Error("AI HTTP "+r.status+" "+text.slice(0,300));
          const j=JSON.parse(text);
          if(j?.ok!==true || typeof j?.text!=="string" || j.text.trim().length<10) throw new Error("AI invalid");
          console.log(JSON.stringify({ok:true,status:r.status,chars:j.text.length,provider:j.provider??null,model:j.model??null}));
          NODE
