name: Ops Post-Redeploy Domain Check

on:
  push:
    branches:
      - ops/live-domain-smoke-2026-10-01

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check live domain after Railway redeploy
        run: |
          set +e
          echo "=== DNS ==="
          dig +short CNAME www.tarifwerk.eu
          dig +short TXT _railway-verify.www.tarifwerk.eu
          echo "=== HTTPS strict ==="
          curl -sS -I --connect-timeout 10 --max-time 25 https://www.tarifwerk.eu/ || true
          echo "=== HTTPS ignore-cert HOME ==="
          curl -k -sS -D - -o /tmp/home --connect-timeout 10 --max-time 25 https://www.tarifwerk.eu/ || true
          head -c 500 /tmp/home 2>/dev/null || true
          echo
          echo "=== READY ignore-cert ==="
          curl -k -sS -D - --connect-timeout 10 --max-time 25 https://www.tarifwerk.eu/api/ready || true
          echo
          echo "=== CERT ==="
          IP="$(dig +short A www.tarifwerk.eu | tail -n1)"
          echo "IP=$IP"
          if [ -n "$IP" ]; then
            echo | openssl s_client -connect "$IP:443" -servername www.tarifwerk.eu 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          fi
