name: Ops Domain Reconnect Check

on:
  push:
    branches:
      - ops/live-domain-smoke-2026-10-01

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check DNS TLS and live site
        run: |
          set +e
          echo "=== DNS CNAME www ==="
          dig +short CNAME www.tarifwerk.eu
          echo "=== DNS A www ==="
          dig +short A www.tarifwerk.eu
          echo "=== DNS apex ==="
          dig +short A tarifwerk.eu
          echo "=== Railway target DNS ==="
          dig +short A tarifwerk-web-production-4b7e.up.railway.app
          echo "=== HTTPS www ==="
          curl -svI --connect-timeout 10 --max-time 25 https://www.tarifwerk.eu/ 2>&1 || true
          echo "=== HTTPS ready ==="
          curl -sv --connect-timeout 10 --max-time 25 https://www.tarifwerk.eu/api/ready 2>&1 || true
          echo "=== Certificate ==="
          IP="$(dig +short A www.tarifwerk.eu | tail -n1)"
          echo "resolved_ip=$IP"
          if [ -n "$IP" ]; then
            echo | openssl s_client -connect "$IP:443" -servername www.tarifwerk.eu 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          fi
