name: Ops Railway TXT Check

on:
  push:
    branches:
      - ops/live-domain-smoke-2026-10-01

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect likely Railway verification records
        run: |
          set +e
          for name in             www.tarifwerk.eu             tarifwerk.eu             _railway-verify.www.tarifwerk.eu             _railway-verify.tarifwerk.eu             railway-verify.www.tarifwerk.eu             railway-verify.tarifwerk.eu             _acme-challenge.www.tarifwerk.eu             _acme-challenge.tarifwerk.eu
          do
            echo "=== TXT $name ==="
            dig +short TXT "$name"
            echo "=== CNAME $name ==="
            dig +short CNAME "$name"
          done
