name: Ops SSL Preconditions

on:
  push:
    branches:
      - ops/live-domain-smoke-2026-10-01

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check CAA DNSSEC and domain conflicts
        run: |
          set +e
          echo "=== CAA apex ==="
          dig +short CAA tarifwerk.eu
          echo "=== CAA www ==="
          dig +short CAA www.tarifwerk.eu
          echo "=== DS apex ==="
          dig +short DS tarifwerk.eu
          echo "=== DNSKEY apex ==="
          dig +short DNSKEY tarifwerk.eu
          echo "=== CNAME www ==="
          dig +short CNAME www.tarifwerk.eu
          echo "=== A www ==="
          dig +short A www.tarifwerk.eu
          echo "=== AAAA www ==="
          dig +short AAAA www.tarifwerk.eu
          echo "=== TXT verify ==="
          dig +short TXT _railway-verify.www.tarifwerk.eu
          echo "=== trace TXT ==="
          dig +trace TXT _railway-verify.www.tarifwerk.eu | tail -n 80
