name: Ops Authoritative TXT Check

on:
  push:
    branches:
      - ops/live-domain-smoke-2026-10-01

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-24.04
    steps:
      - name: Check authoritative STRATO DNS
        run: |
          set +e
          echo "=== NS ==="
          NS="$(dig +short NS tarifwerk.eu)"
          echo "$NS"
          echo "=== recursive TXT ==="
          dig +short TXT _railway-verify.www.tarifwerk.eu
          for ns in $NS; do
            echo "=== $ns TXT _railway-verify.www.tarifwerk.eu ==="
            dig @"$ns" +short TXT _railway-verify.www.tarifwerk.eu
            echo "=== $ns CNAME www.tarifwerk.eu ==="
            dig @"$ns" +short CNAME www.tarifwerk.eu
          done
          echo "=== possible misplaced TXT names ==="
          for n in             _railway-verify.tarifwerk.eu             _railway-verify.www.tarifwerk.eu.tarifwerk.eu             www.tarifwerk.eu             tarifwerk.eu
          do
            echo "--- $n"
            dig +short TXT "$n"
          done
