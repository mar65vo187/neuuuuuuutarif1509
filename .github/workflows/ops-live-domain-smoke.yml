name: Ops WWW Routing Behind TLS

on:
  push:
    branches:
      - ops/live-domain-smoke-2026-10-01

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify routing while Railway certificate is provisioning
        run: |
          set -e
          echo "=== HOME ==="
          curl -kfsSI --connect-timeout 10 --max-time 30 https://www.tarifwerk.eu/
          echo "=== READY ==="
          curl -kfsS --connect-timeout 10 --max-time 30 https://www.tarifwerk.eu/api/ready
          echo
          echo "=== PORTAL LOGIN ==="
          code="$(curl -k -sS -o /tmp/login.html -w '%{http_code}' --connect-timeout 10 --max-time 30 https://www.tarifwerk.eu/portal/login)"
          echo "HTTP=$code"
          test "$code" = "200"
          echo "=== PUBLIC AI ==="
          node --input-type=module <<'NODE'
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0";
          const base = "https://www.tarifwerk.eu";
          const r = await fetch(base + "/api/public-ai", {
            method:"POST",
            signal:AbortSignal.timeout(60000),
            headers:{
              "content-type":"application/json",
              "origin":base,
              "sec-fetch-site":"same-origin"
            },
            body:JSON.stringify({
              messages:[{role:"user",content:"Welche Themen kann TarifWerk beraten? Antworte kurz."}],
              audience:"b2c",
              pagePath:"/"
            })
          });
          const body = await r.text();
          if(!r.ok) throw new Error("AI HTTP " + r.status + " " + body.slice(0,300));
          const j = JSON.parse(body);
          if(j?.ok !== true || typeof j?.text !== "string" || j.text.trim().length < 10) throw new Error("AI invalid response");
          console.log(JSON.stringify({ok:true,status:r.status,chars:j.text.length,provider:j.provider??null,model:j.model??null}));
          NODE
