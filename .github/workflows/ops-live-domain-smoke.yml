name: Ops Strict WWW Final

on:
  push:
    branches:
      - ops/live-domain-smoke-2026-10-01

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Strict HTTPS verification
        run: |
          set +e
          echo "=== DNS ==="
          dig +short CNAME www.tarifwerk.eu
          dig +short TXT _railway-verify.www.tarifwerk.eu
          echo "=== STRICT HOME ==="
          curl -sS -D - -o /tmp/home --connect-timeout 10 --max-time 30 https://www.tarifwerk.eu/
          HOME_RC=$?
          echo "curl_rc=$HOME_RC"
          head -c 300 /tmp/home 2>/dev/null || true
          echo
          echo "=== STRICT READY ==="
          curl -sS -D - --connect-timeout 10 --max-time 30 https://www.tarifwerk.eu/api/ready
          READY_RC=$?
          echo
          echo "ready_rc=$READY_RC"
          echo "=== CERT ==="
          IP="$(dig +short A www.tarifwerk.eu | tail -n1)"
          echo | openssl s_client -connect "$IP:443" -servername www.tarifwerk.eu 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          if [ "$HOME_RC" -ne 0 ] || [ "$READY_RC" -ne 0 ]; then exit 1; fi
