name: Ops Live Domain Diagnostics

on:
  push:
    branches:
      - ops/live-domain-smoke-2026-10-01

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: DNS and TLS diagnostics
        run: |
          set +e
          echo "=== resolv.conf ==="
          cat /etc/resolv.conf
          echo "=== dig NS tarifwerk.eu ==="
          dig +short NS tarifwerk.eu
          echo "=== dig A tarifwerk.eu ==="
          dig +short A tarifwerk.eu
          echo "=== dig AAAA tarifwerk.eu ==="
          dig +short AAAA tarifwerk.eu
          echo "=== dig CNAME www.tarifwerk.eu ==="
          dig +short CNAME www.tarifwerk.eu
          echo "=== dig A www.tarifwerk.eu ==="
          dig +short A www.tarifwerk.eu
          echo "=== dig AAAA www.tarifwerk.eu ==="
          dig +short AAAA www.tarifwerk.eu
          echo "=== nslookup www.tarifwerk.eu ==="
          nslookup www.tarifwerk.eu
          echo "=== curl www ==="
          curl -Iv --connect-timeout 10 --max-time 20 https://www.tarifwerk.eu/ 2>&1 || true
          echo "=== curl apex ==="
          curl -Iv --connect-timeout 10 --max-time 20 https://tarifwerk.eu/ 2>&1 || true
          echo "=== curl Railway backend ==="
          curl -Iv --connect-timeout 10 --max-time 20 https://tarifwerk-prod-production.up.railway.app/api/ready 2>&1 || true
          echo "=== curl Firebase backend ==="
          curl -Iv --connect-timeout 10 --max-time 20 https://neuuuuuuutarif1509--tarifwerk-41e50.europe-west4.hosted.app/api/ready 2>&1 || true
