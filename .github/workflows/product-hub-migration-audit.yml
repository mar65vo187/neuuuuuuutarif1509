name: Product Hub Migration Audit

on:
  push:
    branches:
      - feature/product-partner-growth-hub-20260919

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tarifwerk_test
          POSTGRES_USER: tarifwerk
          POSTGRES_PASSWORD: tarifwerk-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarifwerk -d tarifwerk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tarifwerk:tarifwerk-test-password@localhost:5432/tarifwerk_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply all migrations
        run: npm run db:migrate
      - name: Verify migration checksums and required tables
        run: node scripts/verify-migrations.mjs
      - name: Verify product hub constraints
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            const required = [
              "provider_profiles",
              "product_catalog_profiles",
              "commission_list_versions",
              "commission_rate_versions",
              "benefit_pool_ledger",
              "product_updates",
            ];
            for (const table of required) await pool.query(`select * from ${table} limit 0`);
            let rejected = false;
            try {
              await pool.query("insert into commission_list_versions(provider_id, version, source_name, owner_pool_percent) values (999999,1,'x',14)");
            } catch { rejected = true; }
            if (!rejected) throw new Error("15%-Owner-Pool constraint was not enforced");
            console.log("Product hub migration constraints verified.");
          } finally {
            await pool.end();
          }
          NODE
