              '              <a href={whatsappLink("Hallo TarifWerk, ich hätte eine Frage.")} target="_blank" rel="noopener noreferrer" className="grid h-11 w-11 place-items-center rounded-full border border-white/12 text-white/85 transition-colors duration-200 hover:bg-white/10 hover:text-white" aria-label="WhatsApp schreiben"><MessageCircle className="h-[18px] w-[18px]" /></a>\n',
              '')
