name: Apply formal copy and contact cleanup

on:
  push:
    branches:
      - fix/formal-language-whatsapp-balance-20260919

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/formal-language-whatsapp-balance-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply targeted copy and WhatsApp changes
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]}")
              p.write_text(text.replace(old, new))

          # Header: one clear conversion CTA, no duplicated WhatsApp in desktop/mobile navigation.
          rep("src/components/site/Header.tsx",
              'import { ArrowRight, Menu, MessageCircle, Phone, X } from "lucide-react";',
              'import { ArrowRight, Menu, Phone, X } from "lucide-react";')
