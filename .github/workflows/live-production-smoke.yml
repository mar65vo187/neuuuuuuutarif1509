name: Live Production Smoke

on:
  push:
    branches: [main]
  schedule:
    # Alle 6 Stunden statt alle 30 Minuten: Ein 30-Minuten-Intervall verbrennt
    # ~2.900 Actions-Minuten/Monat und überschreitet damit das kostenlose
    # Kontingent privater Repos (~2.000 Min./Monat). 6 Stunden halten die
    # Überwachung dauerhaft im Free-Bereich.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIVE_BASE_URL: https://www.tarifwerk.eu
      EXPECTED_REVISION: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Live production smoke
        run: node scripts/live-production-smoke.mjs
