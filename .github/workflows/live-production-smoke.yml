name: Live Production Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        base_url:
          - https://www.tarifwerk.eu
          - https://tarifwerk-prod-production.up.railway.app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIVE_BASE_URL: ${{ matrix.base_url }}
      EXPECTED_REVISION: ${{ github.event_name == 'push' && github.sha || '' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Live production smoke
        run: node scripts/live-production-smoke.mjs
