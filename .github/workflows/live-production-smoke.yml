name: Live Production Smoke

on:
  push:
    branches: [main]
  schedule:
    # Kundendomain und beide Hosting-Adressen getrennt pruefen.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Live smoke (${{ matrix.target.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Public domain
            url: https://www.tarifwerk.eu
          - name: Railway
            url: https://tarifwerk-web-production-4b7e.up.railway.app
          - name: Firebase
            url: https://neuuuuuuutarif1509--tarifwerk-41e50.europe-west4.hosted.app
    timeout-minutes: 10
    env:
      LIVE_BASE_URL: ${{ matrix.target.url }}
      EXPECTED_REVISION: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Live production smoke
        run: node scripts/live-production-smoke.mjs
