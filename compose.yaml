# PostgreSQL 17.11: lokale echte Datenbank ohne neuen Node.js-Paketbedarf.
name: tarifwerk
services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: tarifwerk
      POSTGRES_USER: tarifwerk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Zuerst npm run env:init ausführen}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarifwerk -d tarifwerk"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  postgres_data:
